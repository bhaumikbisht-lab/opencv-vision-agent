name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies (headless OpenCV for CI)
        run: pip install numpy opencv-python-headless
      - name: Run tests
        run: python tests/test_agent.py
      - name: Run evaluation harness
        run: python -m vision_agent.evaluate
